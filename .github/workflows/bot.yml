# One cycle of the paper bot with the pretend broker: acts on approvals,
# rejections, the kill switch and requests from the app (Ben, 18 Nov 2026).
# Runs every 10 minutes through the US session on weekdays (GitHub may start
# it a few minutes late), and by hand: Actions tab, "Paper bot (pretend
# broker)", Run workflow; tick "practice" to also propose one made-up
# practice order. Nothing reaches a market. Turn the schedule off once the
# bot runs on Ben's PC with Interactive Brokers. Needs the repository secret
# SUPABASE_SECRET_KEY, and NTFY_TOPIC for phone notifications.
name: Paper bot (pretend broker)

on:
  schedule:
    - cron: '*/10 13-21 * * 1-5'   # weekdays 13:00-21:59 UTC: the US session in both summer and winter
  workflow_dispatch:
    inputs:
      practice:
        description: Propose one made-up practice order
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bot

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://cxpspihahmztfydvdwpd.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # phone notifications; none while it's unset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install .
      - run: python -m stockwizard.run_bot ${{ inputs.practice && '--practice' || '' }}
