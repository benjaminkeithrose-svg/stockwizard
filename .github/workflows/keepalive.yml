# Keeps the Supabase project awake. A free project is paused after a week with
# no activity; this pings it twice a week, three or four days apart, in case
# nothing else has. It calls public.keepalive() (migration
# 20261116020000_keepalive.sql), which reads no data, with the publishable key,
# which is public anyway (web/src/config.ts). A failed run emails the
# repository owner. Run it by hand: Actions tab, "Keep Supabase awake".
name: Keep Supabase awake

on:
  schedule:
    - cron: '43 20 * * 0,3'   # Sunday and Wednesday 20:43 UTC: Monday and Thursday morning in Sydney
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: https://cxpspihahmztfydvdwpd.supabase.co
          SUPABASE_KEY: sb_publishable_6C3xmFTbEXfkNtt3Xv3Opg_8d0XoGUG
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o reply.txt -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
              -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}') || code=000
            if [ "$code" = 200 ]; then echo "Awake. Database time: $(cat reply.txt)"; exit 0; fi
            echo "Attempt $i: HTTP $code"
            sleep 30
          done
          echo "::error::Supabase did not answer. If the project is already paused, restore it from the Supabase dashboard."
          exit 1
